name = "ba-transit-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Credenciales del GCBA: se cargan como secrets de Wrangler, NUNCA en el repo.
#   wrangler secret put TRANSIT_CLIENT_ID
#   wrangler secret put TRANSIT_CLIENT_SECRET
# Para desarrollo local usar packages/proxy/.dev.vars (ver .dev.vars.example).

[vars]
# Orígenes permitidos para CORS (separados por coma). Nunca "*".
ALLOWED_ORIGIN = "https://transport-ba-proxy.vercel.app,http://localhost:5173"
